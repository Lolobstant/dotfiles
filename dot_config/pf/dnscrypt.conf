# DNS redirect 53 → 5300 (dnscrypt-proxy)
# Interfaces : lo0, en0-en3 (Ethernet/WiFi), utun0-utun3 (VPN/WireGuard)
rdr pass on lo0                        proto { udp, tcp } from any to 127.0.0.1 port 53 -> 127.0.0.1 port 5300
rdr pass on { en0, en1, en2, en3 }     proto { udp, tcp } from any to any       port 53 -> 127.0.0.1 port 5300
rdr pass on { utun0, utun1, utun2, utun3 } proto { udp, tcp } from any to any   port 53 -> 127.0.0.1 port 5300
